<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tetris · philgoose</title>
<meta name="description" content="SRS 회전, 7-bag, 홀드, 고스트 피스를 지원하는 브라우저 테트리스">
<style>
:root{
  --bg:#0d0f14; --panel:#161a22; --line:#252b37; --text:#e8ecf3; --muted:#8a93a6; --accent:#7cc4ff;
  --I:#3ad6e8; --O:#f5d547; --T:#b77cf2; --S:#5fd38a; --Z:#f2665f; --J:#5b8cf5; --L:#f5a043;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.wrap{display:flex;gap:16px;align-items:flex-start;padding:16px}
.side{display:flex;flex-direction:column;gap:12px;width:120px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.board-wrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0a0c10}
canvas{display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(10,12,16,.82);backdrop-filter:blur(3px);text-align:center;padding:20px}
.overlay.hidden{display:none}
.overlay h1{font-size:34px;letter-spacing:.08em}
.overlay p{color:var(--muted);font-size:13px;line-height:1.7}
button.big{background:var(--accent);color:#06121d;border:0;border-radius:8px;padding:12px 28px;font-size:16px;font-weight:700;cursor:pointer}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
.keys b{color:var(--text);font-weight:600}
.touch{display:none}
@media (max-width:640px){
  body{align-items:flex-start}
  .wrap{display:grid;grid-template-columns:auto auto;grid-template-areas:"left left" "board right" "touch touch";
    gap:8px;padding:8px;justify-content:center}
  #left{grid-area:left;flex-direction:row;width:auto;gap:6px}
  #left .box{flex:1;min-width:0}
  .board-wrap{grid-area:board}
  .side:not(#left){grid-area:right;width:64px}
  .side .box{padding:5px 6px}
  .label{font-size:9px;margin-bottom:2px}
  .val{font-size:15px}
  #hold{width:48px;height:36px}
  #next{width:52px}
  .keys{display:none}
  .touch{grid-area:touch;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
  .touch button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;height:48px;font-size:20px}
  .touch button:active{background:var(--line)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="side" id="left">
    <div class="box"><div class="label">Hold</div><canvas id="hold" width="96" height="72"></canvas></div>
    <div class="box"><div class="label">Score</div><div class="val" id="score">0</div></div>
    <div class="box"><div class="label">Lines</div><div class="val" id="lines">0</div></div>
    <div class="box"><div class="label">Level</div><div class="val" id="level">1</div></div>
    <div class="box"><div class="label">Best</div><div class="val" id="best">0</div></div>
  </div>
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h1>TETRIS</h1>
      <p id="msg">SRS 회전 · 7-bag · 홀드 · 고스트</p>
      <button class="big" id="start">시작</button>
    </div>
  </div>
  <div class="side">
    <div class="box"><div class="label">Next</div><canvas id="next" width="96" height="264"></canvas></div>
    <div class="box keys">
      <b>← →</b> 이동<br><b>↓</b> 소프트드롭<br><b>Space</b> 하드드롭<br>
      <b>↑ / X</b> 우회전<br><b>Z</b> 좌회전<br><b>C / Shift</b> 홀드<br><b>P / Esc</b> 일시정지
    </div>
  </div>
  <div class="touch" id="touch">
    <button data-a="hold">H</button><button data-a="ccw">↺</button><button data-a="rotate">↻</button><button data-a="pause">❚❚</button>
    <button data-a="left">◀</button><button data-a="soft">▼</button><button data-a="drop">⤓</button><button data-a="right">▶</button>
  </div>
</div>
<script>
(()=>{
const COLS=10, ROWS=20, HIDDEN=2;
const css=getComputedStyle(document.documentElement);
const COLOR={}; 'IOTSZJL'.split('').forEach(k=>COLOR[k]=css.getPropertyValue('--'+k).trim());

// SRS 기준 4방향 셀 좌표
const SHAPES={
  I:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
  O:[[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
  T:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
  S:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
  Z:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]],
  J:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
  L:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[1,0],[1,1],[1,2],[0,2]]]
};
// SRS 월킥 (y는 아래 방향이 +이므로 표준표의 y 부호 반전)
const KICK_JLSTZ={
 '0>1':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]], '1>0':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],
 '1>2':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],   '2>1':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
 '2>3':[[0,0],[1,0],[1,-1],[0,2],[1,2]],    '3>2':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
 '3>0':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'0>3':[[0,0],[1,0],[1,-1],[0,2],[1,2]]
};
const KICK_I={
 '0>1':[[0,0],[-2,0],[1,0],[-2,1],[1,-2]], '1>0':[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
 '1>2':[[0,0],[-1,0],[2,0],[-1,-2],[2,1]], '2>1':[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],
 '2>3':[[0,0],[2,0],[-1,0],[2,-1],[-1,2]], '3>2':[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],
 '3>0':[[0,0],[1,0],[-2,0],[1,2],[-2,-1]], '0>3':[[0,0],[-1,0],[2,0],[-1,-2],[2,1]]
};
const LINE_SCORE=[0,100,300,500,800];

const boardC=document.getElementById('board'), bctx=boardC.getContext('2d');
const holdC=document.getElementById('hold'), hctx=holdC.getContext('2d');
const nextC=document.getElementById('next'), nctx=nextC.getContext('2d');
const $=id=>document.getElementById(id);
let CELL=30;

function fit(){
  const mobile=innerWidth<=640;
  const availH=innerHeight-(mobile?200:40);
  const availW=mobile?innerWidth-96:innerWidth-300;
  CELL=Math.max(14,Math.min(34,Math.floor(Math.min(availH/ROWS,availW/COLS))));
  const dpr=devicePixelRatio||1;
  boardC.width=COLS*CELL*dpr; boardC.height=ROWS*CELL*dpr;
  boardC.style.width=COLS*CELL+'px'; boardC.style.height=ROWS*CELL+'px';
  bctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

let grid,cur,bag,queue,hold,holdUsed,score,lines,level,dropTimer,lockTimer,lockMoves,running,paused,over,last,best;
try{best=+localStorage.getItem('philgoose-tetris-best')||0}catch(e){best=0}
$('best').textContent=best;

function newBag(){const b='IOTSZJL'.split('');for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}return b}
function pull(){while(queue.length<7)queue.push(...newBag());return queue.shift()}
function spawn(type){
  cur={type,rot:0,x:3,y:0};
  if(collide(cur.x,cur.y,cur.rot)){end();return false}
  if(!collide(cur.x,cur.y+1,cur.rot))cur.y++; // 보이는 영역에 즉시 등장
  lockTimer=0;lockMoves=0;dropTimer=0;return true;
}
function cells(p,x=p.x,y=p.y,r=p.rot){return SHAPES[p.type][r].map(([cx,cy])=>[x+cx,y+cy])}
function collide(x,y,r,p=cur){
  for(const [cx,cy] of SHAPES[p.type][r]){
    const gx=x+cx, gy=y+cy;
    if(gx<0||gx>=COLS||gy>=ROWS+HIDDEN)return true;
    if(gy>=0&&grid[gy][gx])return true;
  }return false;
}
function grounded(){return collide(cur.x,cur.y+1,cur.rot)}
function resetLock(){if(grounded()&&lockMoves<15){lockTimer=0;lockMoves++}}
function move(dx){if(!collide(cur.x+dx,cur.y,cur.rot)){cur.x+=dx;resetLock();return true}return false}
function rotate(dir){
  if(cur.type==='O')return;
  const from=cur.rot, to=(from+dir+4)%4;
  const table=cur.type==='I'?KICK_I:KICK_JLSTZ;
  for(const [kx,ky] of table[from+'>'+to]){
    if(!collide(cur.x+kx,cur.y+ky,to)){cur.x+=kx;cur.y+=ky;cur.rot=to;resetLock();return}
  }
}
function soft(){if(!grounded()){cur.y++;score+=1;dropTimer=0;return true}return false}
function hard(){let n=0;while(!grounded()){cur.y++;n++}score+=n*2;lock()}
function doHold(){
  if(holdUsed)return;
  const t=cur.type;
  if(hold){const h=hold;hold=t;spawn(h)}else{hold=t;spawn(pull())}
  holdUsed=true;
}
function lock(){
  let above=true;
  for(const [x,y] of cells(cur)){if(y>=0)grid[y][x]=cur.type; if(y>=HIDDEN)above=false}
  if(above){end();return}
  let cleared=0;
  for(let y=ROWS+HIDDEN-1;y>=0;y--){
    if(grid[y].every(v=>v)){grid.splice(y,1);grid.unshift(Array(COLS).fill(null));cleared++;y++}
  }
  if(cleared){score+=LINE_SCORE[cleared]*level;lines+=cleared;level=Math.floor(lines/10)+1;flash=cleared>=4?12:6}
  holdUsed=false;
  spawn(pull());
  hud();
}
let flash=0;
function gravity(){return Math.max(16,1000*Math.pow(0.8-(level-1)*0.007,level-1))}

function reset(){
  grid=Array.from({length:ROWS+HIDDEN},()=>Array(COLS).fill(null));
  queue=[];hold=null;holdUsed=false;score=0;lines=0;level=1;over=false;paused=false;flash=0;
  spawn(pull());hud();
}
function hud(){
  $('score').textContent=score;$('lines').textContent=lines;$('level').textContent=level;
  if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('philgoose-tetris-best',best)}catch(e){}}
}
function end(){
  over=true;running=false;hud();
  $('overlay').classList.remove('hidden');
  $('overlay').querySelector('h1').textContent='GAME OVER';
  $('msg').innerHTML=`점수 <b>${score}</b> · 라인 ${lines} · 레벨 ${level}`;
  $('start').textContent='다시 시작';
}
function togglePause(){
  if(!running&&!paused)return;
  paused=!paused;running=!paused;
  const o=$('overlay');
  if(paused){o.classList.remove('hidden');o.querySelector('h1').textContent='PAUSED';$('msg').textContent='P 또는 Esc로 재개';$('start').textContent='계속'}
  else{o.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
}
function start(){
  if(paused){togglePause();return}
  reset();running=true;$('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(loop);
}

function loop(t){
  if(!running)return;
  const dt=Math.min(100,t-last);last=t;
  das(dt);
  if(grounded()){
    lockTimer+=dt;
    if(lockTimer>=500)lock();
  }else{
    dropTimer+=dt;
    const g=softHeld?Math.min(gravity(),40):gravity();
    while(dropTimer>=g&&running){dropTimer-=g;if(!grounded()){cur.y++;if(softHeld)score+=1}else break}
  }
  if(flash>0)flash--;
  draw();hud();
  if(running)requestAnimationFrame(loop);
}

// 렌더링
function block(ctx,x,y,s,color,alpha=1){
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;ctx.fillRect(x+1,y+1,s-2,s-2);
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x+1,y+1,s-2,Math.max(2,s*.14));
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(x+1,y+s-1-Math.max(2,s*.12),s-2,Math.max(2,s*.12));
  ctx.globalAlpha=1;
}
function draw(){
  if(!grid){bctx.fillStyle='#0a0c10';bctx.fillRect(0,0,COLS*CELL,ROWS*CELL);return}
  bctx.fillStyle=flash>0?'#141a26':'#0a0c10';bctx.fillRect(0,0,COLS*CELL,ROWS*CELL);
  bctx.strokeStyle='#161b25';bctx.lineWidth=1;
  for(let x=1;x<COLS;x++){bctx.beginPath();bctx.moveTo(x*CELL+.5,0);bctx.lineTo(x*CELL+.5,ROWS*CELL);bctx.stroke()}
  for(let y=1;y<ROWS;y++){bctx.beginPath();bctx.moveTo(0,y*CELL+.5);bctx.lineTo(COLS*CELL,y*CELL+.5);bctx.stroke()}
  for(let y=HIDDEN;y<ROWS+HIDDEN;y++)for(let x=0;x<COLS;x++)if(grid[y][x])block(bctx,x*CELL,(y-HIDDEN)*CELL,CELL,COLOR[grid[y][x]]);
  if(cur&&!over){
    let gy=cur.y;while(!collide(cur.x,gy+1,cur.rot))gy++;
    for(const [x,y] of cells(cur,cur.x,gy))if(y>=HIDDEN){
      bctx.strokeStyle=COLOR[cur.type];bctx.globalAlpha=.5;bctx.lineWidth=2;
      bctx.strokeRect(x*CELL+2,(y-HIDDEN)*CELL+2,CELL-4,CELL-4);bctx.globalAlpha=1;
    }
    const a=grounded()?1-Math.min(.35,lockTimer/1400):1;
    for(const [x,y] of cells(cur))if(y>=HIDDEN)block(bctx,x*CELL,(y-HIDDEN)*CELL,CELL,COLOR[cur.type],a);
  }
  mini(hctx,holdC,hold?[hold]:[],holdUsed);
  mini(nctx,nextC,queue?queue.slice(0,5):[],false);
}
function mini(ctx,c,types,dim){
  ctx.clearRect(0,0,c.width,c.height);
  const s=16;
  types.forEach((t,i)=>{
    const sh=SHAPES[t][0];
    const xs=sh.map(p=>p[0]),ys=sh.map(p=>p[1]);
    const w=(Math.max(...xs)-Math.min(...xs)+1)*s,h=(Math.max(...ys)-Math.min(...ys)+1)*s;
    const ox=(c.width-w)/2-Math.min(...xs)*s, oy=i*52+(52-h)/2+4-Math.min(...ys)*s;
    sh.forEach(([x,y])=>block(ctx,ox+x*s,oy+y*s,s,dim?'#3a4050':COLOR[t]));
  });
}

// 입력: DAS/ARR
const DAS=150,ARR=40;let held={left:false,right:false},dasT=0,arrT=0,lastDir=0,softHeld=false;
function das(dt){
  const dir=held.left&&lastDir===-1?-1:held.right&&lastDir===1?1:held.left?-1:held.right?1:0;
  if(!dir){dasT=0;arrT=0;return}
  dasT+=dt;
  if(dasT>=DAS){arrT+=dt;while(arrT>=ARR){arrT-=ARR;if(!move(dir))break}}
}
function press(dir){held[dir<0?'left':'right']=true;lastDir=dir;dasT=0;arrT=0;move(dir)}
function act(a,down=true){
  if(a==='pause'){if(down)togglePause();return}
  if(!running)return;
  if(a==='left'||a==='right'){const d=a==='left'?-1:1;if(down)press(d);else held[a]=false;return}
  if(a==='soft'){softHeld=down;if(down)soft();return}
  if(!down)return;
  ({rotate:()=>rotate(1),ccw:()=>rotate(-1),drop:hard,hold:doHold})[a]?.();
  draw();
}
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'soft',ArrowUp:'rotate',KeyX:'rotate',KeyZ:'ccw',
  ControlLeft:'ccw',Space:'drop',KeyC:'hold',ShiftLeft:'hold',ShiftRight:'hold',KeyP:'pause',Escape:'pause'};
addEventListener('keydown',e=>{
  if((e.code==='Enter'||e.code==='Space')&&!running&&!paused){e.preventDefault();start();return}
  const a=KEYMAP[e.code];if(!a)return;e.preventDefault();
  if(e.repeat&&a!=='soft')return;
  act(a,true);
});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)act(a,false)});
addEventListener('blur',()=>{held.left=held.right=false;softHeld=false;if(running)togglePause()});
document.querySelectorAll('#touch button').forEach(b=>{
  const a=b.dataset.a;
  b.addEventListener('pointerdown',e=>{e.preventDefault();act(a,true)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>act(a,false)));
});
// 보드 스와이프 (모바일)
let tx,ty,tt,moved;
boardC.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY;tt=performance.now();moved=false});
boardC.addEventListener('pointermove',e=>{
  if(tx==null||!running)return;
  const dx=e.clientX-tx,dy=e.clientY-ty;
  if(Math.abs(dx)>CELL){move(Math.sign(dx));tx=e.clientX;moved=true}
  else if(dy>CELL){soft();ty=e.clientY;moved=true}
});
boardC.addEventListener('pointerup',e=>{
  if(tx==null)return;
  const dy=e.clientY-ty,dt=performance.now()-tt;
  if(running&&!moved&&dt<250)rotate(1);
  else if(running&&dy>CELL*3&&dt<200)hard();
  tx=null;
});
$('start').addEventListener('click',start);
addEventListener('resize',fit);
fit();
})();
</script>
</body>
</html>
